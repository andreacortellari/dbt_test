version: 2

models:
  - name: dim_customers
    description: This table contains the main details of our fictional customers and insights about their purchasing history

    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('_stg_negozio__customers')
                field: customer_id

      - name: first_name
        quote: true
        description: "{{ doc('first_name') }}"

      - name: last_name
        quote: true
        description: "{{ doc('last_name') }}"

      - name: first_order_date
        quote: true
        description: This is the date of a customer's first order

      - name: most_recent_order_date
        quote: true
        description: This is the most recent date of a customer's order

      - name: number_of_orders
        quote: true
        description: Ths is the total number of orders put in by a customer
        data_tests:
          - not_null

      - name: lifetime_value
        quote: true
        description: This is the lifetime value of a customer, defined as the total of all their succesfull payments, expressed in dollars