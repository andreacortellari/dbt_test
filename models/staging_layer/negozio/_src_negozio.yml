sources:
  - name: negozio
    database: dbt-tutorial
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        columns:
        - name: id
          tests:
            - not_null
      
        config:
          freshness: null
      - name: orders
        columns:
          - name: id
            tests:
              - not_null
              - unique