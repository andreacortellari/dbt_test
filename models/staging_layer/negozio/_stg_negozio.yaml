version: 2

models:
  - name: _stg_negozio__customers
    description: This table contains the main details of our fictional customers

    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - not_null
          - unique

      - name: first_name
        quote: true
        description: "{{ doc('first_name') }}"

      - name: last_name
        quote: true
        description: "{{ doc('last_name') }}"

  - name: _stg_negozio__orders
    description: This table contains the main details of the orders placed with the shop

    columns:
      - name: order_id
        quote: true
        description: "{{ doc('order_id') }}"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "{{ doc('customer_id') }}"
        tests:
          - not_null

      - name: order_date
        quote: true
        description: This is the data when an order was placed

      - name: status
        quote: true
        description: This is the status of an order
