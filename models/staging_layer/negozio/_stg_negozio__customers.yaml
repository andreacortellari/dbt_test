version: 2

models:
  - name: _stg_negozio__customers
    description: This table contains the main details of our fictional customers

    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - not_null

      - name: first_name
        quote: true
        description: "{{ doc('first_name') }}"

      - name: last_name
        quote: true
        description: "{{ doc('last_name') }}"